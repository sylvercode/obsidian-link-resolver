language = "C"
cpp_compat = true
include_guard = "OBSIDIAN_LINK_RESOLVER_H"
pragma_once = true
autogen_warning = "/* This file is auto-generated by cbindgen. Do not edit. */"

[parse]
parse_deps = false

[export]
include = [
    "OlrSession",
    "OlrStatus",
    "olr_version",
    "olr_session_open",
    "olr_resolve",
    "olr_string_free",
    "olr_session_close",
]

[export.rename]
"OlrSession" = "OlrSession"
"OlrStatus" = "OlrStatus"
