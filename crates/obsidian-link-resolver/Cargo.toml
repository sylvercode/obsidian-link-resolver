[package]
name = "obsidian-link-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "obsidian_link_resolver"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
walkdir = "2"

[dev-dependencies]
criterion = "0.8"
libloading = "0.8"
tempfile = "3"

[[bench]]
name = "resolve"
harness = false

[build-dependencies]
cbindgen = "0.29"
