[package]
name = "obsidian-link-resolver-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "obsidian-link-resolver-mcp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["kv"] }
notify = "8.2.0"
obsidian-link-resolver = { path = "../obsidian-link-resolver" }
rmcp = { version = "3.5.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
structured-logger = { version = "1.0.5", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "mcp_warm"
path = "benches/mcp_warm.rs"
harness = false
# The benchmark emits a machine-readable report instead of using a test harness.
