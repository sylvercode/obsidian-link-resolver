[package]
name = "obsidian-link-resolver-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "obsidian-link-resolver"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
obsidian-link-resolver = { path = "../obsidian-link-resolver" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"
