[package]
name = "obsidian-link-resolver"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenAI"]

[lib]
name = "obsidian_link_resolver"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "obsidian-link-resolver"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = "0.8"

[build-dependencies]
cbindgen = "0.29"

[profile.release]
lto = true
codegen-units = 1
