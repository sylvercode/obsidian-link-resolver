name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check published MCP contract compatibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/check-mcp-contract-compatibility.ps1 specs/002-mcp-wrapper/contracts/mcp-contract.json published MIGRATION.md
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: |
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
      - name: Install cross-compilation toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Run workspace tests and build release artifacts
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo build --release --workspace
          cargo bench -p obsidian-link-resolver-mcp --bench mcp_warm > "$RUNNER_TEMP/mcp-warm-report.json"
          cargo bench -p obsidian-link-resolver-mcp --bench mcp_cold_start > "$RUNNER_TEMP/mcp-cold-start-report.json"
          cargo bench -p obsidian-link-resolver --bench resolve -- --warm-up-time 0.1
          cargo build --workspace --release --target x86_64-unknown-linux-gnu
          cargo build --workspace --release --target aarch64-unknown-linux-gnu
      - name: Retain MCP benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-benchmark-reports-${{ github.ref_name }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mcp-warm-report.json
            ${{ runner.temp }}/mcp-cold-start-report.json
      - name: Stage release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          cp target/release/obsidian-link-resolver "dist/obsidian-link-resolver-${RELEASE_TAG}-linux-x86_64"
          cp target/release/obsidian-link-resolver-mcp "dist/obsidian-link-resolver-mcp-${RELEASE_TAG}-linux-x86_64"
          cp target/release/libobsidian_link_resolver.so "dist/libobsidian_link_resolver-${RELEASE_TAG}-linux-x86_64.so"

          cp target/aarch64-unknown-linux-gnu/release/obsidian-link-resolver "dist/obsidian-link-resolver-${RELEASE_TAG}-linux-aarch64"
          cp target/aarch64-unknown-linux-gnu/release/obsidian-link-resolver-mcp "dist/obsidian-link-resolver-mcp-${RELEASE_TAG}-linux-aarch64"
          cp target/aarch64-unknown-linux-gnu/release/libobsidian_link_resolver.so "dist/libobsidian_link_resolver-${RELEASE_TAG}-linux-aarch64.so"

          cp crates/obsidian-link-resolver/include/obsidian_link_resolver.h "dist/obsidian_link_resolver-${RELEASE_TAG}.h"
          cp specs/002-mcp-wrapper/contracts/mcp-contract.json dist/mcp-contract.json
      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux
          path: dist/

  build-windows:
    name: Build Windows release assets (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Build release artifacts
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc
      - name: Stage release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/obsidian-link-resolver.exe "dist/obsidian-link-resolver-${RELEASE_TAG}-windows-x86_64.exe"
          cp target/x86_64-pc-windows-msvc/release/obsidian-link-resolver-mcp.exe "dist/obsidian-link-resolver-mcp-${RELEASE_TAG}-windows-x86_64.exe"
          cp target/x86_64-pc-windows-msvc/release/obsidian_link_resolver.dll "dist/libobsidian_link_resolver-${RELEASE_TAG}-windows-x86_64.dll"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: dist/

  build-macos:
    name: Build macOS release assets (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Build release artifacts
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Stage release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${TARGET}/release/obsidian-link-resolver" "dist/obsidian-link-resolver-${RELEASE_TAG}-darwin-${ARCH}"
          cp "target/${TARGET}/release/obsidian-link-resolver-mcp" "dist/obsidian-link-resolver-mcp-${RELEASE_TAG}-darwin-${ARCH}"
          cp "target/${TARGET}/release/libobsidian_link_resolver.dylib" "dist/libobsidian_link_resolver-${RELEASE_TAG}-darwin-${ARCH}.dylib"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.arch }}
          path: dist/

  publish-release:
    needs: [release, build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist/
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
